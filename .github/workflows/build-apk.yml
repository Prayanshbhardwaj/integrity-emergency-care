name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EmergencySaarthi.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Emergency Saarthi v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Emergency Saarthi - Android App

            ### ⬇️ Download karne ke liye:
            Neeche **EmergencySaarthi.apk** pe click karo

            ### 📲 Install kaise karein:
            1. APK download karo
            2. Phone mein **Settings → Security → Unknown Sources** enable karo
            3. Downloaded APK open karo aur install karo
          files: EmergencySaarthi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
