name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to public folder
        run: |
          mkdir -p apk-host
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-host/IntegrityEmergencyCare.apk
          cat > apk-host/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Download Integrity Emergency Care</title>
            <style>
              body { font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f0f4f8; }
              .card { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; }
              h1 { color: #1E3A8A; margin-bottom: 8px; }
              p { color: #666; margin-bottom: 24px; }
              .btn { display: inline-block; background: #1E3A8A; color: white; padding: 16px 32px; border-radius: 12px; text-decoration: none; font-size: 1.1rem; font-weight: bold; }
              .note { font-size: 0.8rem; color: #999; margin-top: 16px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🏥 Integrity Emergency Care</h1>
              <p>Download and install the Android app on your phone</p>
              <a href="IntegrityEmergencyCare.apk" class="btn">⬇️ Download APK</a>
              <p class="note">Enable "Unknown Sources" in Settings before installing</p>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy APK to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          cd apk-host
          vercel deploy --prod --yes --token $VERCEL_TOKEN --name integrity-apk-download
